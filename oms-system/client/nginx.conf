server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For all other routes, return index.html so React Router handles them
    # Without this, refreshing on /orders or /customers returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
